name: npm release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: C++ toolchain
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang
          fi
          sudo sysctl -w vm.mmap_rnd_bits=28
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          CI: '1'
      - run: npm publish -w @open-yescoin/maprama-protocol --access public --provenance
      - run: npm publish -w @open-yescoin/maprama-engine-web --access public --provenance
